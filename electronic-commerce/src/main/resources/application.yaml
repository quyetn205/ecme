server:
  port: ${PORT:8081}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ecommercevs}
    driver-class-name: "com.mysql.cj.jdbc.Driver"
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 3600
  issuer: "quyet.com"

open:
  api:
    title: "E-commerce API"
    version: "1.0.0"
    description: "API documentation for the E-commerce application"
    serverUrl: "http://localhost:8081"
    serverName: "E-commerce Server"

google:
  client-id: "308909425420-unv2kmm8mp1bpshlsgih8bk4afhk9842.apps.googleusercontent.com"
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8081/auth/google/callback}
  token-uri: "https://oauth2.googleapis.com/token"
  user-info-uri: "https://www.googleapis.com/oauth2/v3/userinfo"
  authorization-uri: "https://accounts.google.com/o/oauth2/v2/auth"

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}